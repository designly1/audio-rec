[package]
name = "audio-rec"
version = "0.2.0"
edition = "2024"
description = "A small Windows Bluetooth audio receiver"
license = "MIT"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
windows = { version = "0.62.2", features = ["Devices_Enumeration", "Media_Audio", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

